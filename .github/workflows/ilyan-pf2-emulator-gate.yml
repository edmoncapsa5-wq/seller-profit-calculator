name: Ilyan PF2 Real mGBA Runtime Gate

on:
  push:
    branches:
      - ilyan-pf2-emulator-gate
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mgba-runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PF2 gate branch
        uses: actions/checkout@v4

      - name: Install headless X11, window manager, mGBA runtime dependencies, and QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool scrot python3-pil xz-utils wget curl unzip ca-certificates \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libfuse2t64

      - name: Recover validated PF2 base ROM and apply deterministic HUD palette fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_ARTIFACT_ID=10451151867
          BASE_SHA=5231a2c77b679dc4e61cb2b4c5284adafa8a1313ce8b4bd50709d149cd3bbfb2
          FIXED_SHA=5fef701c4ee110dca90a86536996192e8420ce93b476b5b773a92d134d3367a2

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" \
            -o pf2_validated_base.zip
          mkdir -p recovered_base
          unzip -q pf2_validated_base.zip results/pf2.gba -d recovered_base
          echo "$BASE_SHA  recovered_base/results/pf2.gba" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          src=Path('recovered_base/results/pf2.gba')
          data=bytearray(src.read_bytes())
          original=[3171,3,1,3136,1024,67,33,0,34,3168,1088,2147,2113,0,35,2049]
          replacement=[31710,5341,2124,31301,14562,6879,2351,5218,10705,31527,12135,20383,19026,0,3551,26932]
          needle=b''.join(struct.pack('<H',v) for v in original)
          repl=b''.join(struct.pack('<H',v) for v in replacement)
          hits=[]; pos=0
          while True:
              i=data.find(needle,pos)
              if i<0: break
              hits.append(i); pos=i+1
          assert hits == [9996], f'unexpected UI palette signature locations: {hits}'
          data[hits[0]:hits[0]+len(needle)] = repl
          out=Path('pf2_palettefix.gba'); out.write_bytes(data)
          sha=hashlib.sha256(data).hexdigest()
          print('palette patch offset',hex(hits[0]),'sha256',sha)
          assert sha == '5fef701c4ee110dca90a86536996192e8420ce93b476b5b773a92d134d3367a2'
          calc=(0x100-((sum(data[0xA0:0xBD])+0x19)&0xFF))&0xFF
          assert data[0xBD]==calc, (data[0xBD],calc)
          PY
          echo "$FIXED_SHA  pf2_palettefix.gba" | sha256sum -c -

          # Feed the corrected ROM through the exact chunk-reconstruction path used by the runtime gate.
          xz -9e -c pf2_palettefix.gba > pf2_palettefix.gba.xz
          python3 - <<'PY'
          from pathlib import Path
          import base64
          raw=base64.b64encode(Path('pf2_palettefix.gba.xz').read_bytes()).decode('ascii')
          sizes=[10000,10000,20000,20000,20000,20000,20000]
          pos=0
          root=Path('ilyan_pf2_emulator_gate')
          for i,n in enumerate(sizes):
              (root/f'rom.b64.part{i:02d}').write_text(raw[pos:pos+n]); pos+=n
          (root/'rom.b64.part07').write_text(raw[pos:])
          print('runtime base64 bytes',len(raw),'final chunk',len(raw[pos:]))
          PY
          cat ilyan_pf2_emulator_gate/rom.b64.part{00,01,02,03,04,05,06,07} | base64 -d > chunk_recheck.xz
          xz -t chunk_recheck.xz
          xz -dc chunk_recheck.xz > chunk_recheck.gba
          echo "$FIXED_SHA  chunk_recheck.gba" | sha256sum -c -

          # Runtime gate verifies the recovered/patched candidate, not the obsolete failed chunk SHA.
          sed -i "s/b2fbb61129e8fc9bdae6a508d8789b2f15a4287e179c5b80b9451469775c306a/$FIXED_SHA/g" ilyan_pf2_emulator_gate/run_gate.sh
          grep -q "$FIXED_SHA" ilyan_pf2_emulator_gate/run_gate.sh

      - name: Download official mGBA 0.10.5 x64 AppImage
        run: |
          wget -q --show-progress -O mgba.appimage \
            https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-appimage-x64.appimage
          chmod +x mgba.appimage
          ./mgba.appimage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          echo "MGBA_BIN=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Run corrected PF2 native framebuffer/input/render gate
        run: bash ilyan_pf2_emulator_gate/run_gate_software.sh

      - name: Upload corrected real-emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilyan-pf2-corrected-real-mgba-runtime-evidence
          path: |
            screenshots_native/
            screenshots_window/
            results/
            pf2_palettefix.gba
          if-no-files-found: warn
          retention-days: 14
